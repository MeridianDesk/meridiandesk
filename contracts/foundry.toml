[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = [
    "forge-std/=lib/forge-std/src/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
]
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[fuzz]
runs = 1024

[invariant]
runs = 128
depth = 32

# RPCs are resolved from env at run time (keys never committed).
[rpc_endpoints]
robinhood_mainnet = "${RH_RPC_MAINNET}"
robinhood_testnet = "${RH_RPC_TESTNET}"

[lint]
lint_on_build = false
